    <!-- Boot: apply the saved theme before anything paints, and style the loader. -->
    <script>
      try {
        if (location.pathname === '/' && localStorage.getItem('v1-theme') === 'dark')
          document.documentElement.dataset.theme = 'dark'
      } catch (e) {}
    </script>
    <style>
      html { background: #f3f5f8; }
      html[data-theme="dark"] { background: #141b29; }
      body { margin: 0; }
      .boot {
        position: fixed; inset: 0; z-index: 1000;
        display: grid; place-items: center;
        background: #f3f5f8;
        font-family: "Bricolage Grotesque", system-ui, sans-serif;
        color: #172339;
      }
      html[data-theme="dark"] .boot { background: #141b29; color: #e6ebf3; }
      .boot::before {
        content: ""; position: absolute; top: 0; bottom: 0;
        left: clamp(20px, 9vw, 120px); width: 2px; background: #e0574c; opacity: .55;
      }
      /* keep in sync with --margin-x in src/v1/v1.css */
      @media (max-width: 640px) { .boot::before { left: 16px; } }
      .boot-inner { display: grid; justify-items: center; gap: 14px; }
      .boot svg { width: 64px; height: 64px; }
      .boot path {
        fill: none; stroke: #e0574c; stroke-width: 5; stroke-linecap: round; stroke-linejoin: round;
        stroke-dasharray: 80; stroke-dashoffset: 80;
        animation: boot-draw 1.2s cubic-bezier(.65, 0, .35, 1) infinite;
      }
      .boot-name { font-size: 15px; font-weight: 600; letter-spacing: .01em; opacity: .7; }
      @keyframes boot-draw {
        0% { stroke-dashoffset: 80; opacity: 1; }
        55% { stroke-dashoffset: 0; opacity: 1; }
        85% { stroke-dashoffset: 0; opacity: 0; }
        100% { stroke-dashoffset: 80; opacity: 0; }
      }
      @media (prefers-reduced-motion: reduce) {
        .boot path { animation: none; stroke-dashoffset: 0; }
      }
    </style>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
