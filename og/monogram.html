<!doctype html>
<html><head><meta charset="utf-8" />
<!-- Browser-tab icon: "RJ" monogram. Rendered at 512px, then resized to 32/48. -->
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,800&display=swap" rel="stylesheet" />
<style>
  html, body { margin: 0; width: 100vw; height: 100vh; overflow: hidden; background: transparent; }
  .tile {
    position: absolute; inset: 0;
    border-radius: 22%;
    background: #172339;
    display: grid; place-items: center;
  }
  .rj {
    position: relative;
    font-family: "Bricolage Grotesque", sans-serif;
    font-weight: 800;
    font-variation-settings: "opsz" 96;
    font-size: 64vw;
    letter-spacing: -0.02em;
    line-height: 1;
    color: #ffffff;
    margin-top: -6vw;
  }
  /* red underline, the site's margin-line colour */
  .rj::after {
    content: ""; position: absolute; left: 6%; right: 10%; bottom: -6vw;
    height: 7vw; border-radius: 4vw; background: #e0574c;
  }
</style></head>
<body><div class="tile"><span class="rj">RJ</span></div></body></html>
