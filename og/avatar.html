<!doctype html>
<html><head><meta charset="utf-8" />
<!-- Icons: face crop from the illustrated avatar (og/illustration.png, 1024x1024).
     Add ?r=22% for rounded corners (favicon/Android); omit for square (iOS rounds it itself). -->
<style>
  html, body { margin: 0; width: 100vw; height: 100vh; overflow: hidden; background: transparent; }
  .tile {
    position: absolute; inset: 0;
    border-radius: var(--r, 0);
    overflow: hidden;
    background-color: #4a86b2;
    background-image: url(illustration.png);
    /* 520px square around the face: x 270-790, y 130-650 */
    background-size: 197%;
    background-position: 53.6% 25.8%;
  }
</style></head>
<body>
  <div class="tile"></div>
  <script>
    const r = new URLSearchParams(location.search).get('r')
    if (r) document.querySelector('.tile').style.setProperty('--r', r)
  </script>
</body></html>
