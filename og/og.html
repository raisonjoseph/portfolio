<!doctype html>
<html><head><meta charset="utf-8" />
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=Kalam:wght@700&display=swap" rel="stylesheet" />
<style>
  html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; }
  body {
    position: relative;
    background: #f3f5f8;
    background-image: repeating-linear-gradient(to bottom, transparent 0, transparent 41px, #dfe5ef 41px, #dfe5ef 42px);
    font-family: "Bricolage Grotesque", sans-serif;
    color: #172339;
  }
  .margin { position: absolute; top: 0; bottom: 0; left: 96px; width: 3px; background: #e0574c; opacity: .6; }
  .wrap { position: absolute; left: 150px; top: 92px; right: 80px; }
  h1 { margin: 0; font-size: 124px; font-weight: 780; letter-spacing: -0.045em; line-height: .88; }
  .role { margin: 34px 0 0; font-size: 40px; font-weight: 500; letter-spacing: -0.01em; }
  .stack { margin: 14px 0 0; font-size: 28px; color: #55617a; }
  .photo { position: absolute; right: 92px; top: 86px; width: 300px; padding: 14px 14px 16px; background: #fff; border-radius: 4px; transform: rotate(3deg); box-shadow: 0 2px 4px rgba(23,35,57,.08), 0 22px 44px -16px rgba(23,35,57,.35); }
  .photo img { display: block; width: 100%; aspect-ratio: 1; object-fit: cover; border-radius: 2px; }
  .tape { position: absolute; top: -14px; left: 50%; width: 110px; height: 30px; margin-left: -55px; transform: rotate(-4deg); background: rgba(255,227,106,.78); }
  .note { position: absolute; left: 152px; bottom: 58px; font-family: Kalam, cursive; font-weight: 700; color: #e0574c; font-size: 40px; transform: rotate(-4deg); }
  .tick { display: inline-block; width: 52px; height: 52px; vertical-align: -10px; margin-left: 10px; }
</style></head>
<body>
  <div class="margin"></div>
  <div class="wrap">
    <h1>Raison<br />Joseph</h1>
    <p class="role">Senior Front End Developer</p>
    <p class="stack">Seven years of React and TypeScript</p>
  </div>
  <div class="photo"><span class="tape"></span><img src="../public/raison.jpg" alt="" /></div>
  <div class="note">7 × 8 = 56<svg class="tick" viewBox="0 0 64 64"><path d="M10 34 C16 38 20 44 24 52 C32 34 42 20 58 8" fill="none" stroke="#e0574c" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
</body></html>
